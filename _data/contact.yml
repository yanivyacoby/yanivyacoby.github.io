# and the columns lay out left-to-right.
#
# Item fields:
#   icon     Font Awesome class, e.g. "fas fa-envelope" (required)
#   text     plain text — a label, or the part shown before a link (optional)
#   label    linked text; shown as a link when `url` is set (optional)
#   url      link target (optional)
#   new_tab  open the link in a new browser tab (optional, true/false)

