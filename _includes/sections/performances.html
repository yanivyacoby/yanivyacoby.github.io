<!-- Performances: upcoming + past events from _data/performances. -->
{% assign current_date = site.time | date: "%Y-%m-%d %H:%M" %}

<center>
<h2>Upcoming Events</h2>
</center>

{% include performance_list.html keep="upcoming" %}

<p></p>

<center>
<h2>Past Events</h2>
</center>

<div class="events-collapsible" data-initial="0" data-step="5">
  {% include performance_list.html keep="past" %}
  <div class="events-more-wrap">
    <button type="button" class="events-more">Show past events</button>
  </div>
</div>

<script>
  (function () {
    document.querySelectorAll('.events-collapsible').forEach(function (wrap) {
      var initial = parseInt(wrap.getAttribute('data-initial'), 10);
      if (isNaN(initial)) { initial = 5; }
      var step = parseInt(wrap.getAttribute('data-step'), 10);
      if (isNaN(step) || step < 1) { step = 5; }
      var groups = wrap.querySelectorAll('.events-table__group');
      var moreWrap = wrap.querySelector('.events-more-wrap');
      var btn = wrap.querySelector('.events-more');
      if (!btn || groups.length <= initial) { if (moreWrap) { moreWrap.style.display = 'none'; } return; }
      var shown = initial;
      function render() {
        groups.forEach(function (g, i) { g.style.display = i < shown ? '' : 'none'; });
        moreWrap.style.display = shown >= groups.length ? 'none' : '';
        btn.textContent = shown === 0 ? 'Show past events' : 'Load more';
      }
      btn.addEventListener('click', function () { shown += step; render(); });
      render();
    });
  })();
</script>
